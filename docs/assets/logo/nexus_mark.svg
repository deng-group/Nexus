<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Nexus logo mark: a letter N drawn as a small knowledge graph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)" stroke="#d7deea" stroke-width="2"/>
  <!-- edges: the letter N as a node-link diagram -->
  <g stroke="#8a98ad" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="36" y1="92" x2="36" y2="36"/>
    <line x1="36" y1="36" x2="92" y2="92"/>
    <line x1="92" y1="92" x2="92" y2="36"/>
    <!-- concept side links -->
    <line x1="36" y1="36" x2="18" y2="20" stroke-width="3.5"/>
    <line x1="92" y1="92" x2="110" y2="108" stroke-width="3.5"/>
    <line x1="92" y1="36" x2="110" y2="20" stroke-width="3.5"/>
    <line x1="36" y1="92" x2="18" y2="108" stroke-width="3.5"/>
  </g>
  <!-- chapter nodes (blue) -->
  <g fill="#ffffff" stroke="#2563eb" stroke-width="5">
    <circle cx="36" cy="36" r="11"/>
    <circle cx="92" cy="92" r="11"/>
  </g>
  <g fill="#2563eb">
    <circle cx="36" cy="92" r="12"/>
    <circle cx="92" cy="36" r="12"/>
  </g>
  <!-- concept nodes (orange) -->
  <g fill="#d97706">
    <circle cx="18" cy="20" r="6"/>
    <circle cx="110" cy="20" r="6"/>
    <circle cx="18" cy="108" r="6"/>
    <circle cx="110" cy="108" r="6"/>
  </g>
</svg>
