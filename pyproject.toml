[project]
name = "wendao"
version = "0.1.0"
description = "Turn course notes into an interactive knowledge graph and a course-grounded AI learning agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zeyu Deng" }]
dependencies = [
    "flask>=3.0,<4",
    "nbformat>=5.9,<6",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3,<6",
]

[project.optional-dependencies]
# Production WSGI server, used by deploy/mle-course-helper.service.
deploy = ["gunicorn>=22,<24"]

[project.scripts]
wendao = "wendao.cli:main"

[project.urls]
Homepage = "https://github.com/deng-group/Nexus"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wendao = ["web/static/**/*", "web/templates/*", "starter/*"]
